name: Publish Nix substitute release
description: Upload a Nix cache artifact to an existing release and optionally publish a release flake branch and version tag

inputs:
  tag:
    description: Existing GitHub Release tag to attach the cache to
    required: true
  token:
    description: GitHub token with contents write permission for uploading assets and publishing the flake branch
    default: ${{ github.token }}
  repository:
    description: Repository containing the release and flake branch, in owner/repo form
    default: ${{ github.repository }}
  artifact-name:
    description: Cache artifact produced by the root action
    default: nix-cache
  flake-directory:
    description: Optional release flake directory to publish (must not contain .git)
    default: ''
  flake-branch:
    description: Branch for the release flake
    default: flakes

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/nix-substitute-release/${{ inputs.artifact-name }}

    - name: Upload cache assets
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ inputs.repository }}
        NSR_TAG: ${{ inputs.tag }}
        NSR_CACHE_DIRECTORY: ${{ runner.temp }}/nix-substitute-release/${{ inputs.artifact-name }}
      run: |
        gh release upload "$NSR_TAG" "$NSR_CACHE_DIRECTORY"/* --clobber

    - name: Publish release flake branch and tag
      if: inputs.flake-directory != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ inputs.repository }}
        NSR_TAG: ${{ inputs.tag }}
        NSR_FLAKE_DIRECTORY: ${{ inputs.flake-directory }}
        NSR_FLAKE_BRANCH: ${{ inputs.flake-branch }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/publish-flake.sh"
